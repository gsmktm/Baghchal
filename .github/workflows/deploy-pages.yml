name: Publish Royal Baghchal to GitHub Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "baghchal-pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish playable static game
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare public-only game files
        run: |
          set -euo pipefail
          mkdir -p site/src site/icons site/images
          cp index.html styles.css royal.css sw.js manifest.webmanifest site/
          cp src/engine.js src/ai.js src/main.js src/online-client.js src/bluetooth.js src/intl-extra.js site/src/
          cp icons/*.svg site/icons/
          cp images/*.svg site/images/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/royal.css
          ! test -e site/server/index.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4
